<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkillSpector — Scan Log</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#f5ece3" />
<link rel="preload" href="fonts/open-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/yellowtail-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-title">
      <img class="mark" src="mark.svg" alt="" />
      <h1>SkillSpector</h1>
    </div>
    <div id="health" class="health">checking installation…</div>
  </div>
</header>

<main>

  <section class="scan-bar">
    <input id="scan-input" type="text" placeholder="Git URL, local path, or .zip — e.g. https://github.com/user/some-skill" />
    <label class="llm-toggle">
      <input type="checkbox" id="use-llm" />
      LLM review
    </label>
    <button id="scan-btn" class="btn btn-primary">Scan</button>
  </section>

  <div id="scan-status" class="scan-status" role="status" hidden></div>

  <section id="list-view">
    <div class="skill-table-wrap">
      <table class="skill-table">
        <thead>
          <tr>
            <th class="col-name" scope="col">Skill</th>
            <th class="col-score" scope="col">Score</th>
            <th class="col-verdict" scope="col">Verdict</th>
            <th class="col-status" scope="col">Gate</th>
            <th class="col-date" scope="col">Last scanned</th>
          </tr>
        </thead>
        <tbody id="skill-rows">
        </tbody>
      </table>
    </div>
    <p id="empty-state" class="empty-state" hidden>
      No skills scanned yet. Paste a source above and run a scan.
    </p>
  </section>

  <section id="detail-view" hidden>
    <div class="detail-actions">
      <button id="back-btn" class="btn-text">← Back to log</button>
      <button id="delete-btn" class="btn-text btn-text-danger">Delete from log</button>
    </div>

    <div class="detail-head">
      <div>
        <h2 id="detail-name"></h2>
        <div id="detail-source" class="detail-source"></div>
      </div>
      <div class="detail-score-block">
        <div id="detail-score" class="detail-score">—</div>
        <div id="detail-verdict" class="detail-verdict-label"></div>
      </div>
    </div>

    <div class="gate-bar">
      <span class="gate-label">Install gate:</span>
      <button class="btn gate-btn" data-status="approved">Approve</button>
      <button class="btn gate-btn" data-status="rejected">Reject</button>
      <button class="btn gate-btn" data-status="pending">Reset</button>
      <span id="gate-current" class="gate-current"></span>
    </div>

    <div id="detail-error" class="detail-error" hidden></div>

    <div id="findings-wrap">
      <h3 class="findings-heading">Findings</h3>
      <figure id="severity-breakdown" class="severity-breakdown" hidden></figure>
      <div id="findings-list" class="findings-list"></div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
